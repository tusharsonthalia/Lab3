[project]
name = "lab3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torch-geometric>=2.8.1",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/lab3"]
